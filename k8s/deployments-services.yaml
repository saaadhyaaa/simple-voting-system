apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: voting-v1
  template:
    metadata:
      labels:
        app: voting-v1
    spec:
      containers:
        - name: voting-v1
          image: saadhyaprabu/agileassessment:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: voting-v1-service
spec:
  type: NodePort
  selector:
    app: voting-v1
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30084
---
